name: Publish supplementary videos
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Restore and verify original videos
        run: |
          mkdir -p _site
          cp index.html Video-S1.mp4 Video-S3.mp4 Video-S4.mp4 .nojekyll _site/
          cat video-parts/Video-S2.part* > _site/Video-S2.mp4
          cp SHA256SUMS _site/
          cd _site
          sha256sum --check SHA256SUMS
          rm SHA256SUMS
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
